name: Build ZMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZMusic repo (patch files)
        uses: actions/checkout@v4
        with:
          path: zmusic

      - name: Checkout OuterTune source
        uses: actions/checkout@v4
        with:
          repository: OuterTune/OuterTune
          path: outertune

      
      - name: Apply ZMusic rebrand patch
        run: |
          cd outertune
          echo "Workspace: $(pwd)"
          echo "Patch file exists: $(ls -la ../zmusic/rebrand.patch)"
          echo "Logo file exists: $(ls -la ../zmusic/launcher_foreground.png)"
          git apply --whitespace=fix --verbose ../zmusic/rebrand.patch || {
            echo "git apply failed, trying patch command"
            patch -p1 --fuzz=3 < ../zmusic/rebrand.patch
          }
          cp ../zmusic/launcher_foreground.png app/src/main/res/drawable/
          rm -f app/src/main/res/drawable/launcher_foreground.xml
          rm -f app/src/main/res/drawable/launcher_monochrome.xml
          echo "Rebrand applied successfully"
