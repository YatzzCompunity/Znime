name: Build ZMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZMusic repo
        uses: actions/checkout@v4
        with:
          path: zmusic

      - name: Checkout OuterTune source
        uses: actions/checkout@v4
        with:
          repository: OuterTune/OuterTune
          path: outertune

      - name: Apply ZMusic rebrand
        run: |
          cd outertune
          git apply --whitespace=fix ../zmusic/rebrand.patch || patch -p1 --fuzz=3 < ../zmusic/rebrand.patch
          cp ../zmusic/launcher_foreground.png app/src/main/res/drawable/
          rm -f app/src/main/res/drawable/launcher_foreground.xml
          rm -f app/src/main/res/drawable/launcher_monochrome.xml
          echo "Rebrand OK"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-37" "platform-tools" 2>&1 | tail -3
          $SDKMANAGER "build-tools;37.0.0" 2>&1 | tail -2 || $SDKMANAGER "build-tools;36.0.0" 2>&1 | tail -2

      - name: Create signing keystore
        run: |
          cd outertune
          keytool -genkeypair -keystore zmusic.keystore -alias zmusic -keyalg RSA -keysize 2048 -validity 10950 -storepass android -keypass android -dname "CN=ZMusic"
          printf 'storeFile=%s/zmusic.keystore\nstorePassword=android\nkeyAlias=zmusic\nkeyPassword=android\n' "$PWD" > keystore.properties
          echo "keystore.properties OK"

      - name: Build release APK
        run: |
          cd outertune
          chmod +x gradlew
          ./gradlew assembleFullRelease --no-daemon -x test --stacktrace

      - name: Find APK
        run: |
          cd outertune
          find app/build/outputs -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZMusic-APK
          path: outertune/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
