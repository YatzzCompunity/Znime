name: Build ZMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ZMusic repo (patch files)
        uses: actions/checkout@v4
        with:
          path: zmusic

      - name: Checkout OuterTune source
        uses: actions/checkout@v4
        with:
          repository: OuterTune/OuterTune
          path: outertune

      - name: Apply ZMusic branding (copy modified files)
        run: |
          cd outertune
          # Copy ZMusic-modified files over fresh upstream (no patch = no fragility)
          cp -r ../zmusic/overlay/* .
          # Logos
          cp ../zmusic/launcher_foreground.png app/src/main/res/drawable/
          cp ../zmusic/launcher_monochrome.png app/src/main/res/drawable/
          rm -f app/src/main/res/drawable/launcher_foreground.xml
          rm -f app/src/main/res/drawable/launcher_monochrome.xml
          echo "ZMusic files applied"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK (use preinstalled + add packages)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "platforms;android-37" "build-tools;36.0.0" "build-tools;37.0.0"
          echo "SDK ready"

      - name: Create release keystore
        run: |
          cd outertune
          keytool -genkeypair \
            -keystore zmusic-release.keystore \
            -alias zmusic \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass zmusic123 -keypass zmusic123 \
            -dname "CN=ZMusic, OU=ZMusic, O=ZMusic, L=Jakarta, ST=Jakarta, C=ID"
          printf 'storeFile=zmusic-release.keystore\nkeyAlias=zmusic\nkeyPassword=zmusic123\nstorePassword=zmusic123\n' > keystore.properties
          echo "Keystore created"

      - name: Build ZMusic release APK (full variant)
        run: |
          cd outertune
          chmod +x gradlew
          ./gradlew assembleFullRelease --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZMusic-APK
          path: outertune/app/build/outputs/apk/full/release/*.apk
